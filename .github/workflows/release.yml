name: Release

# Push a tag like v0.1.0 to build, test, publish to NuGet and create a GitHub release.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Publishing uses NuGet Trusted Publishing (no long-lived API key):
#   1. nuget.org > your profile > Trusted Publishing > Create:
#      owner "xavave", repository "SkyBellSharp", workflow file "release.yml".
#   2. Repository secret NUGET_USER = your nuget.org profile name (not your email).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # GitHub release
  id-token: write   # OIDC token for NuGet Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build SkyBellSharp.slnx -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test SkyBellSharp.slnx -c Release --no-build

      - name: Pack
        run: >
          dotnet pack src/SkyBellSharp/SkyBellSharp.csproj -c Release --no-build
          -p:Version=${{ steps.version.outputs.value }} -o artifacts

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "SkyBellSharp ${{ steps.version.outputs.value }}"
          --generate-notes
