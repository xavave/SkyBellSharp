name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SkyBellSharp.slnx

      - name: Build
        run: dotnet build SkyBellSharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SkyBellSharp.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack (check)
        run: dotnet pack src/SkyBellSharp/SkyBellSharp.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
